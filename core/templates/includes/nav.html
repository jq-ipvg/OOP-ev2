{% load static %}
<nav class="navbar navbar-expand-lg navbar-bus">
    <div class="container">
        <a class="navbar-brand" href="{% url 'home' %}">
            <img src="{% static 'core/img/bus-icon.svg' %}" alt="Bus" width="24" height="24">
            Reserva tu Boleto
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                {% if user.is_authenticated %}
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'boletos:bus_list' %}">Buses</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'boletos:mis_reservas' %}">Mis Reservas</a>
                </li>
                {% endif %}
            </ul>
            <ul class="navbar-nav ms-auto align-items-lg-center">
                {% if not user.is_authenticated %}
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'login' %}">Iniciar Sesión</a>
                </li>
                <li class="nav-item">
                    <a class="btn btn-outline-accent ms-2" href="{% url 'register' %}">Registrarse</a>
                </li>
                {% else %}
                <li class="nav-item">
                    <span class="navbar-user">
                        <i class="bi bi-person-circle me-1"></i>
                        {{ user.username }}
                    </span>
                </li>
                <li class="nav-item">
                    <form action="{% url 'logout' %}" method="POST" class="d-inline">
                        {% csrf_token %}
                        <button class="btn-link-accent" type="submit">
                            <i class="bi bi-box-arrow-right me-1"></i>Salir
                        </button>
                    </form>
                </li>
                {% endif %}
            </ul>
        </div>
    </div>
</nav>
