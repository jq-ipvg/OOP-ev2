{% if messages %}
<div class="toast-container-fixed">
    {% for message in messages %}
    <div class="alert-toast alert-toast-{% if message.tags %}{{ message.tags }}{% else %}info{% endif %}">
        <i class="bi bi-{% if message.tags == 'success' %}check-circle{% elif message.tags == 'error' %}x-circle{% elif message.tags == 'warning' %}exclamation-triangle{% else %}info-circle{% endif %}"></i>
        {{ message }}
    </div>
    {% endfor %}
</div>
<script>
    setTimeout(function() {
        document.querySelectorAll('.alert-toast').forEach(function(el) {
            el.style.opacity = '0';
            el.style.transform = 'translateX(1rem)';
            el.style.transition = 'opacity 0.3s ease, transform 0.3s ease';
            setTimeout(function() { el.remove(); }, 300);
        });
    }, 4000);
</script>
{% endif %}
