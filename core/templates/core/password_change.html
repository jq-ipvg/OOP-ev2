{% extends 'layouts/nada.html' %}
{% load crispy_forms_tags %}
{% load static %}

{% block content %}
<div class="auth-card">
    <div class="card">
        <div class="card-body text-center">
            <i class="bi bi-key" style="font-size: 2.5rem; color: var(--color-text-secondary); margin-bottom: 0.5rem; display: block;"></i>
            <h1>Cambiar Contraseña</h1>
            <form method="POST">
                {% csrf_token %}
                {{ form | crispy }}
                <button class="btn-accent mt-2" type="submit">Cambiar Contraseña</button>
            </form>
            <p class="mt-3">
                <a href="{% url 'profile' %}" class="auth-footer">Volver a mi perfil</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
