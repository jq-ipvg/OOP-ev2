{% extends 'layouts/nada.html' %}
{% load crispy_forms_tags %}
{% load static %}

{% block content %}
<div class="auth-card">
    <div class="card">
        <div class="card-body text-center">
            <img src="{% static 'core/img/bus-icon.svg' %}" alt="Bus" class="auth-icon">
            <h1>Registro Empresarial</h1>
            <p class="text-secondary mb-3" style="font-size: 0.875rem;">Crea una cuenta para gestionar tus buses y reservas.</p>
            <form method="POST">
                {% csrf_token %}
                {{ form | crispy }}
                <button class="btn-accent mt-2" type="submit">Crear Cuenta Empresarial</button>
            </form>
            <p class="auth-footer">
                ¿Eres cliente? <a href="{% url 'register' %}">Regístrate aquí</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
