{% extends 'layouts/nada.html' %}
{% load crispy_forms_tags %}
{% load static %}

{% block content %}
<div class="auth-card">
    <div class="card">
        <div class="card-body text-center">
            <img src="{% static 'core/img/bus-icon.svg' %}" alt="Bus" class="auth-icon">
            <h1>Crear Cuenta</h1>
            <form method="POST">
                {% csrf_token %}
                {{ form | crispy }}
                <button class="btn-accent mt-2" type="submit">Crear Cuenta</button>
            </form>
            <p class="auth-footer">
                ¿Ya tienes cuenta? <a href="{% url 'login' %}">Inicia sesión aquí</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
