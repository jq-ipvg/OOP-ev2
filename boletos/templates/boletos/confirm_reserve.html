{% extends 'layouts/base.html' %}
{% load static %}

{% block content %}
<section class="page-section">
    <div class="confirm-card">
        <div class="card">
            <div class="card-body">
                <img src="{% static 'core/img/bus-icon.svg' %}" alt="Bus" style="width: 2.5rem; height: 2.5rem; color: var(--color-text-secondary); margin-bottom: 0.5rem;">
                <h1 class="h4 mb-2">Confirmar Reserva</h1>
                <p class="text-secondary mb-0">Vas a reservar el asiento:</p>
                <div class="seat-number">{{ asiento.numero }}</div>
                <p class="bus-name">
                    <i class="bi bi-bus-front me-1"></i> {{ asiento.bus.nombre }} — {{ asiento.bus.placa }}
                </p>
                <form method="POST">
                    {% csrf_token %}
                    <div class="d-flex gap-3 justify-content-center">
                        <button type="submit" class="btn-accent">
                            <i class="bi bi-check-lg me-1"></i>Sí, reservar
                        </button>
                        <a href="{% url 'boletos:seat_grid' asiento.bus.pk %}" class="btn-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</section>
{% endblock %}
