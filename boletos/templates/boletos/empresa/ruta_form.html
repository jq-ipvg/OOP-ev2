{% extends 'layouts/base.html' %}
{% load static %}
{% load crispy_forms_tags %}

{% block content %}
<section class="page-section">
    <div class="page-card" style="max-width: 560px;">
        <div class="mb-3">
            <a href="{% url 'boletos:empresa_ruta_list' %}" class="btn-back">
                <i class="bi bi-arrow-left"></i> Volver
            </a>
        </div>
        <div class="page-header text-center">
            <h1>Crear Ruta</h1>
            <p class="text-secondary">Define el origen, destino y duración estimada del viaje.</p>
        </div>

        <form method="POST" class="mx-auto" style="max-width: 380px;">
            {% csrf_token %}
            {{ form | crispy }}
            <div class="text-center mt-3">
                <button type="submit" class="btn-accent">Crear Ruta</button>
            </div>
        </form>
    </div>
</section>
{% endblock %}
