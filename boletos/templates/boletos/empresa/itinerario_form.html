{% extends 'layouts/base.html' %}
{% load static %}
{% load crispy_forms_tags %}

{% block content %}
<section class="page-section">
    <div class="page-card" style="max-width: 560px;">
        <div class="mb-3">
            <a href="{% url 'boletos:empresa_itinerario_list' %}" class="btn-back">
                <i class="bi bi-arrow-left"></i> Volver
            </a>
        </div>
        <div class="page-header text-center">
            <h1>Crear Itinerario</h1>
            <p class="text-secondary">Asigna un horario a un bus para una ruta específica.</p>
        </div>

        <form method="POST" class="mx-auto" style="max-width: 380px;">
            {% csrf_token %}
            {{ form | crispy }}
            <div class="text-center mt-3">
                <button type="submit" class="btn-accent">Crear Itinerario</button>
            </div>
        </form>
    </div>
</section>
<script>
    function toggleFecha() {
        var tipo = document.querySelector('select[name="tipo"]')?.value;
        var grupo = document.getElementById('div_id_fecha_especifica');
        if (grupo) {
            grupo.style.display = tipo === 'unico' ? 'block' : 'none';
        }
    }
    document.addEventListener('DOMContentLoaded', function() {
        toggleFecha();
        document.querySelector('select[name="tipo"]')?.addEventListener('change', toggleFecha);
    });
</script>
{% endblock %}
